<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clean Slate">
<title>Clean Slate · Gym Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0a0a0a; --dark:#111; --card:#161616; --card2:#1e1e1e;
  --border:#252525; --border2:#333;
  --accent:#e8ff47; --cardio:#3dffa0; --muted:#555; --muted2:#8a8a8a;
  --text:#efefef; --done:#4ade80; --danger:#ff5c5c;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; overscroll-behavior-y:none; }
button,input,select,textarea { font-family:'DM Sans',sans-serif; }
input,select,textarea { background:var(--card2); border:1px solid var(--border2); color:var(--text); border-radius:8px; padding:11px 12px; font-size:15px; width:100%; }
input:focus,select:focus,textarea:focus { outline:none; border-color:var(--accent); }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{transform:translateY(46px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }

#app { padding-bottom:calc(86px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; animation:fadeIn .18s ease; }

/* top bar */
.top-bar { display:flex; align-items:center; gap:13px; padding:22px 20px 18px; }
.back-btn { width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--muted2); flex-shrink:0; }
.top-label { font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:.05em; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-action { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); cursor:pointer; padding:8px 4px; flex-shrink:0; }

.section-head { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; display:flex; align-items:center; gap:10px; }
.section-head::after { content:''; flex:1; height:1px; background:var(--border); }
.pad { padding:0 20px; }

/* HOME */
.home-head { padding:26px 20px 4px; margin-bottom:20px; }
.home-eyebrow { font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.sync-dot { width:7px; height:7px; border-radius:50%; background:var(--done); }
.sync-dot.offline { background:var(--danger); animation:pulse 1.6s infinite; }
.home-title { font-family:'Bebas Neue',sans-serif; font-size:56px; line-height:.88; }
.home-title em { color:var(--accent); font-style:normal; display:block; }
.home-date { font-size:13px; color:var(--muted2); margin-top:9px; }

.week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:26px; }
.wday { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:10px 3px 7px; text-align:center; cursor:pointer; position:relative; overflow:hidden; }
.wday::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--wc,transparent); }
.wday.is-today { border-color:var(--accent); }
.wday-name { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
.wday-type { font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:.03em; line-height:1.05; color:var(--wc,var(--muted)); min-height:13px; }
.wday-tick { font-size:9px; color:var(--done); height:11px; margin-top:2px; }

.today-card { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:20px; margin-bottom:26px; cursor:pointer; position:relative; overflow:hidden; }
.today-card::before { content:''; position:absolute; top:0; left:0; width:4px; height:100%; background:var(--wc,var(--border2)); }
.tc-eyebrow { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted2); margin-bottom:5px; }
.tc-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.tc-name { font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:1; color:var(--wc,var(--muted2)); }
.tc-cta { font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:8px 14px; border-radius:5px; border:1px solid var(--wc,var(--border2)); color:var(--wc,var(--muted2)); white-space:nowrap; margin-top:3px; }
.tc-sub { font-size:13px; color:var(--muted2); margin-top:12px; line-height:1.5; }

.srow { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin-bottom:6px; }
.srow-l { display:flex; align-items:center; gap:12px; min-width:0; }
.srow-dot { width:7px; height:7px; border-radius:50%; background:var(--wc,var(--muted)); flex-shrink:0; }
.srow-name { font-size:14px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.srow-sub { font-size:12px; color:var(--muted2); margin-top:1px; }
.srow-meta { font-size:12px; color:var(--muted); flex-shrink:0; }

.home-stats { display:flex; gap:7px; }
.hstat { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:13px 8px; flex:1; text-align:center; }
.hstat-val { font-family:'Bebas Neue',sans-serif; font-size:29px; color:var(--accent); line-height:1; }
.hstat-label { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:3px; }

/* SESSION */
.warmup-block { margin:0 20px 12px; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--cardio); border-radius:0 9px 9px 0; padding:13px 15px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
.warmup-block.done-wu { opacity:.5; }
.wu-l { display:flex; align-items:center; gap:11px; min-width:0; }
.wu-title { font-size:14px; font-weight:400; }
.wu-sub { font-size:11px; color:var(--muted2); margin-top:2px; }
.wu-tick { width:29px; height:29px; border-radius:50%; border:1.5px solid var(--border2); display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
.warmup-block.done-wu .wu-tick { background:var(--done); border-color:var(--done); color:#000; }

.ex-wrap { padding:0 20px; display:flex; flex-direction:column; gap:8px; }
.ss-tag-row { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted2); margin:5px 0 0; display:flex; align-items:center; gap:8px; }
.ss-tag-row::after { content:''; flex:1; height:1px; background:var(--border); }
.ex-card { background:var(--card); border:1px solid var(--border); border-radius:11px; overflow:hidden; }
.ex-card.ex-done { border-color:rgba(74,222,128,.3); }
.ex-head { padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px; user-select:none; }
.ex-head-l { min-width:0; flex:1; }
.ex-exname { font-size:14px; font-weight:400; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ex-target { font-family:'Bebas Neue',sans-serif; font-size:21px; letter-spacing:.04em; line-height:1; }
.ex-tmeta { font-size:11px; color:var(--muted2); margin-top:3px; }
.ex-done-badge { font-size:11px; color:var(--done); display:none; white-space:nowrap; }
.ex-card.ex-done .ex-done-badge { display:block; }
.ex-chev { font-size:11px; color:var(--muted); transition:transform .2s; }
.ex-card.ex-open .ex-chev { transform:rotate(180deg); }
.ex-body { display:none; padding:0 16px 16px; border-top:1px solid var(--border); }
.ex-card.ex-open .ex-body { display:block; }
.ex-note { font-size:12px; color:var(--muted2); font-style:italic; line-height:1.6; margin:12px 0; padding-left:10px; border-left:2px solid var(--border2); }

.weight-row { display:flex; align-items:center; justify-content:space-between; background:var(--card2); border:1px solid var(--border); border-radius:9px; padding:9px 13px; margin-bottom:12px; }
.wlabel { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.wctrl { display:flex; align-items:center; gap:2px; }
.wbtn { background:none; border:1px solid var(--border2); color:var(--text); width:35px; height:35px; border-radius:7px; font-size:19px; cursor:pointer; line-height:1; }
.wbtn:active { background:var(--border); }
.wval { font-family:'Bebas Neue',sans-serif; font-size:24px; min-width:100px; text-align:center; }
.wunit { font-size:11px; color:var(--muted2); font-family:'DM Sans',sans-serif; }

.set-row { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--border); }
.set-row:last-of-type { border-bottom:none; }
.set-num { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); width:38px; flex-shrink:0; }
.rep-ctrl { display:flex; align-items:center; gap:2px; flex:1; justify-content:center; }
.rbtn { background:none; border:1px solid var(--border2); color:var(--text); width:33px; height:33px; border-radius:7px; font-size:17px; cursor:pointer; line-height:1; }
.rbtn:active { background:var(--border); }
.rep-val { font-family:'Bebas Neue',sans-serif; font-size:22px; min-width:56px; text-align:center; }
.rep-val small { font-size:10px; color:var(--muted2); font-family:'DM Sans',sans-serif; letter-spacing:.05em; }
.log-btn { width:64px; height:35px; border-radius:8px; border:1.5px solid var(--border2); background:none; color:var(--muted2); font-size:12px; letter-spacing:.05em; cursor:pointer; flex-shrink:0; }
.set-row.logged .log-btn { background:rgba(74,222,128,.1); border-color:var(--done); color:var(--done); }
.set-row.logged .rep-val,.set-row.logged .set-num { color:var(--done); }

.next-hint { font-size:12px; color:var(--muted2); margin-top:12px; padding:10px 12px; background:rgba(232,255,71,.04); border:1px solid rgba(232,255,71,.12); border-radius:7px; line-height:1.55; }
.nh-up { color:var(--accent); font-weight:500; }
.nh-hold { color:var(--muted2); font-weight:500; }
.nh-wup { color:#ff6b35; font-weight:500; }

/* rest timer pill */
.timer-pill { position:fixed; bottom:calc(150px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--accent); border-radius:99px; padding:10px 18px; display:flex; align-items:center; gap:14px; z-index:150; animation:slideUp .25s ease; box-shadow:0 8px 30px rgba(0,0,0,.6); }
.timer-num { font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--accent); min-width:52px; text-align:center; }
.timer-lbl { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted2); max-width:110px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.timer-skip { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted2); cursor:pointer; border:none; background:none; padding:6px; }

/* finish bar */
.finish-bar { position:fixed; bottom:calc(64px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:100%; max-width:640px; padding:14px 20px 12px; background:linear-gradient(transparent,var(--black) 30%); z-index:90; }
.finish-prog { font-size:11px; color:var(--muted); text-align:center; margin-bottom:7px; }
.finish-prog-bar { height:2px; background:var(--border); border-radius:2px; margin-bottom:10px; }
.finish-prog-fill { height:100%; background:var(--accent); border-radius:2px; transition:width .3s; }
.finish-btn { width:100%; padding:15px; background:var(--accent); color:#000; border:none; border-radius:11px; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.1em; cursor:pointer; }
.finish-btn:disabled { background:var(--border); color:var(--muted); }
.finish-btn.cardio-style { background:var(--cardio); }

/* CARDIO */
.cardio-title { font-family:'Bebas Neue',sans-serif; font-size:44px; line-height:.92; color:var(--cardio); margin-bottom:8px; }
.cardio-desc { font-size:14px; color:var(--muted2); line-height:1.6; margin-bottom:18px; }
.dur-display { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:24px; text-align:center; margin-bottom:18px; }
.dur-num { font-family:'Bebas Neue',sans-serif; font-size:72px; color:var(--cardio); line-height:1; }
.dur-unit { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin-top:3px; }
.opt-item { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:13px 15px; font-size:14px; display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:6px; }
.opt-item.opt-sel { border-color:var(--cardio); background:rgba(61,255,160,.04); }
.opt-radio { width:17px; height:17px; border-radius:50%; border:1.5px solid var(--border2); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.opt-item.opt-sel .opt-radio { background:var(--cardio); border-color:var(--cardio); }
.opt-item.opt-sel .opt-radio::after { content:''; width:6px; height:6px; border-radius:50%; background:#000; }
.cardio-note { font-size:12px; color:var(--muted2); font-style:italic; line-height:1.6; padding:12px 14px; background:var(--card); border-left:3px solid var(--cardio); border-radius:0 9px 9px 0; margin-top:4px; }

/* REST */
.rest-card { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:28px 24px; text-align:center; }
.rest-emoji { font-size:42px; margin-bottom:13px; }
.rest-title { font-family:'Bebas Neue',sans-serif; font-size:30px; color:var(--muted2); margin-bottom:9px; }
.rest-desc { font-size:13px; color:var(--muted2); line-height:1.7; }

/* HISTORY */
.month-head { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.05em; color:var(--muted2); margin:20px 0 10px; display:flex; align-items:baseline; gap:10px; }
.month-count { font-size:11px; font-family:'DM Sans',sans-serif; color:var(--muted); letter-spacing:.05em; }
.hist-row { background:var(--card); border:1px solid var(--border); border-radius:9px; margin-bottom:6px; overflow:hidden; }
.hist-head { padding:13px 15px; display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; }
.hist-l { display:flex; align-items:center; gap:11px; min-width:0; }
.hist-date { font-size:11px; color:var(--muted); width:52px; flex-shrink:0; }
.hist-name { font-size:14px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hist-body { display:none; border-top:1px solid var(--border); padding:12px 15px; }
.hist-row.open .hist-body { display:block; }
.hlog-row { display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:5px 0; border-bottom:1px solid var(--border); }
.hlog-row:last-child { border-bottom:none; }
.hlog-name { color:var(--text); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hlog-sets { color:var(--muted2); flex-shrink:0; font-variant-numeric:tabular-nums; }
.empty-note { font-size:13px; color:var(--muted); text-align:center; padding:40px 20px; line-height:1.6; }

/* MANAGE */
.mrow { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:13px 15px; display:flex; align-items:center; gap:11px; margin-bottom:6px; }
.mrow-name { flex:1; min-width:0; font-size:14px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mrow-sub { font-size:11px; color:var(--muted2); margin-top:1px; }
.icon-btn { width:33px; height:33px; border-radius:7px; border:1px solid var(--border2); background:none; color:var(--muted2); cursor:pointer; font-size:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.icon-btn:active { background:var(--border); }
.icon-btn.danger { color:var(--danger); border-color:rgba(255,92,92,.3); }
.add-btn { width:100%; padding:13px; background:none; border:1.5px dashed var(--border2); border-radius:9px; color:var(--muted2); font-size:13px; letter-spacing:.05em; cursor:pointer; margin-top:4px; }
.form-field { margin-bottom:13px; }
.form-label { font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block; }
.form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.save-btn { width:100%; padding:15px; background:var(--accent); color:#000; border:none; border-radius:11px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.1em; cursor:pointer; margin-top:6px; }
.del-btn { width:100%; padding:12px; background:none; border:1px solid rgba(255,92,92,.3); border-radius:9px; color:var(--danger); font-size:13px; cursor:pointer; margin-top:10px; }
.sched-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.sched-day { font-family:'Bebas Neue',sans-serif; font-size:16px; width:42px; color:var(--muted2); flex-shrink:0; }
.color-swatches { display:flex; gap:8px; flex-wrap:wrap; }
.swatch { width:34px; height:34px; border-radius:8px; cursor:pointer; border:2px solid transparent; }
.swatch.sel { border-color:#fff; }

/* MODAL */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:300; align-items:flex-end; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal-sheet { background:var(--dark); border-top:1px solid var(--border2); border-radius:20px 20px 0 0; padding:26px 22px calc(38px + env(safe-area-inset-bottom)); width:100%; max-width:640px; animation:slideUp .28s ease; max-height:80vh; overflow-y:auto; }
.modal-title { font-family:'Bebas Neue',sans-serif; font-size:34px; color:var(--done); margin-bottom:4px; }
.modal-sub { font-size:13px; color:var(--muted2); margin-bottom:18px; }
.prog-item { background:var(--card); border:1px solid var(--border); border-radius:9px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; }
.prog-name { font-size:13px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prog-chg { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.04em; flex-shrink:0; }
.pc-rep { color:var(--accent); } .pc-wt { color:#ff6b35; } .pc-hold { color:var(--muted2); }
.modal-btn { width:100%; padding:15px; background:var(--done); color:#000; border:none; border-radius:11px; font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:.1em; cursor:pointer; margin-top:12px; }

/* bottom nav */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:640px; display:flex; background:rgba(10,10,10,.92); backdrop-filter:blur(14px); border-top:1px solid var(--border); z-index:100; padding-bottom:env(safe-area-inset-bottom); }
.nav-item { flex:1; padding:11px 0 10px; text-align:center; cursor:pointer; color:var(--muted); }
.nav-item.active { color:var(--accent); }
.nav-ico { font-size:19px; line-height:1; }
.nav-lbl { font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-top:4px; }

/* toast */
#toast { position:fixed; bottom:calc(80px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--card2); border:1px solid var(--border2); border-radius:99px; padding:10px 20px; font-size:13px; z-index:400; display:none; white-space:nowrap; box-shadow:0 8px 30px rgba(0,0,0,.6); }

/* loading */
.loading { text-align:center; padding:80px 20px; color:var(--muted); font-size:13px; letter-spacing:.1em; text-transform:uppercase; animation:pulse 1.4s infinite; }
</style>
</head>
<body>

<div id="app"><div class="loading">Loading programme…</div></div>

<div id="modal" class="modal-overlay">
  <div class="modal-sheet" id="modal-inner"></div>
</div>

<nav class="bottom-nav" id="bnav" style="display:none">
  <div class="nav-item" data-nav="home" onclick="nav('home')"><div class="nav-ico">▦</div><div class="nav-lbl">Home</div></div>
  <div class="nav-item" data-nav="history" onclick="nav('history')"><div class="nav-ico">◷</div><div class="nav-lbl">History</div></div>
  <div class="nav-item" data-nav="manage" onclick="nav('manage')"><div class="nav-ico">✎</div><div class="nav-lbl">Manage</div></div>
</nav>

<div id="toast"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════
// CLEAN SLATE v3 — Gym Tracker
// Backend: Airtable via Cloudflare Worker
// ═══════════════════════════════════════════════════════════
const WORKER_URL = 'https://gym-tracker.stephen-nolan85.workers.dev';
const CACHE_KEY = 'cleanslate_v3_cache';
const QUEUE_KEY = 'cleanslate_v3_queue';
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SWATCHES = ['#ff6b35','#47b8ff','#e8ff47','#3dffa0','#c47bff','#ff5c8a','#ffb347','#7bffe4'];

// ── state ──────────────────────────────────────────────────
let DB = { workouts: [], exercises: [], schedule: {}, scheduleRecId: null, sessions: null };
let view = 'home';
let ctx = {};              // view context (workoutId etc.)
let live = null;           // active lift session { workoutId, sets:{exId:[{reps,done}]}, weights:{exId:kg} }
let liveWU = false;        // warmup done flag for active session
let cardioSel = -1;
let timer = null;          // { remaining, iv, label }
let online = true;

// ── api layer ──────────────────────────────────────────────
async function api(path, method, body) {
  const opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(WORKER_URL + path, opts);
  if (!res.ok) { const t = await res.text(); throw new Error('API ' + res.status + ': ' + t.slice(0, 200)); }
  return res.json();
}

async function atList(table) {
  let all = [], offset = null;
  do {
    const q = offset ? ('?offset=' + encodeURIComponent(offset)) : '';
    const data = await api('/' + table + q);
    all = all.concat(data.records || []);
    offset = data.offset || null;
  } while (offset);
  return all;
}

function queuePush(item) {
  const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  q.push(item);
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
}

async function flushQueue() {
  let q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
  if (!q.length) return;
  const remaining = [];
  for (const item of q) {
    try { await api(item.path, item.method, item.body); }
    catch (e) { remaining.push(item); }
  }
  localStorage.setItem(QUEUE_KEY, JSON.stringify(remaining));
  if (q.length && !remaining.length) toast('Offline changes synced ✓');
}

async function writeThrough(path, method, body, critical) {
  try {
    const r = await api(path, method, body);
    online = true;
    return r;
  } catch (e) {
    online = false;
    if (critical) { queuePush({ path, method, body }); toast('Saved offline — will sync'); }
    else toast('Offline — change not saved');
    updateSyncDot();
    return null;
  }
}

// ── data load ──────────────────────────────────────────────
function cacheSave() {
  localStorage.setItem(CACHE_KEY, JSON.stringify({ workouts: DB.workouts, exercises: DB.exercises, schedule: DB.schedule, scheduleRecId: DB.scheduleRecId }));
}
function cacheLoad() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && c.workouts) { DB.workouts = c.workouts; DB.exercises = c.exercises; DB.schedule = c.schedule; DB.scheduleRecId = c.scheduleRecId; return true; }
  } catch (e) {}
  return false;
}

async function loadAll(silent) {
  try {
    const results = await Promise.all([atList('workouts'), atList('exercises'), atList('settings')]);
    DB.workouts = results[0].filter(function(r){ return !r.fields.Archived; })
      .sort(function(a,b){ return (a.fields.Order||0)-(b.fields.Order||0); });
    DB.exercises = results[1].sort(function(a,b){ return (a.fields.Order||0)-(b.fields.Order||0); });
    const schedRec = results[2].find(function(r){ return r.fields.Key === 'schedule'; });
    if (schedRec) { DB.scheduleRecId = schedRec.id; try { DB.schedule = JSON.parse(schedRec.fields.Value || '{}'); } catch(e) { DB.schedule = {}; } }
    online = true;
    cacheSave();
    flushQueue();
  } catch (e) {
    online = false;
    if (!silent) toast('Offline — using cached data');
  }
  updateSyncDot();
}

// ── helpers ────────────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function wo(id) { return DB.workouts.find(function(w){ return w.id === id; }); }
function exsFor(wid) { return DB.exercises.filter(function(e){ return e.fields.WorkoutId === wid; }); }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._to);
  t._to = setTimeout(function(){ t.style.display = 'none'; }, 2600);
}
function updateSyncDot() {
  const d = document.querySelector('.sync-dot');
  if (d) d.classList.toggle('offline', !online);
}
function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
function restLabel(sec) { return sec >= 60 ? (sec/60) + ' min rest' : sec + 's rest'; }
function fmtDate(iso) {
  const p = iso.split('-');
  return p[2] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(p[1],10)-1];
}

// progression preview: given exercise fields + minimum reps achieved
function nextStep(f, minReps) {
  const target = f.TargetReps || f.RepMin;
  if (minReps < target) return { kind: 'hold', reps: target, wt: f.Weight };
  let reps = target + 1, wt = f.Weight, wup = false;
  if (reps > f.RepMax) { reps = f.RepMin; wt = Math.round((wt + (f.Increment||2.5)) * 100) / 100; wup = true; }
  return { kind: wup ? 'wup' : 'up', reps: reps, wt: wt };
}

// ── navigation ─────────────────────────────────────────────
function nav(v, c) {
  view = v; ctx = c || {};
  render();
  window.scrollTo(0, 0);
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.classList.toggle('active', n.dataset.nav === (v === 'home' || v === 'history' || v === 'manage' ? v : ''));
  });
}

// ── render root ────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  document.getElementById('bnav').style.display = 'flex';
  stopTimerUI();
  if (view === 'home') app.innerHTML = vHome();
  else if (view === 'session') app.innerHTML = vSession();
  else if (view === 'cardio') app.innerHTML = vCardio();
  else if (view === 'rest') app.innerHTML = vRest();
  else if (view === 'history') { app.innerHTML = '<div class="loading">Loading history…</div>'; loadHistory(); }
  else if (view === 'manage') app.innerHTML = vManage();
  else if (view === 'editWorkout') app.innerHTML = vEditWorkout();
  else if (view === 'editExercise') app.innerHTML = vEditExercise();
  if (timer) showTimerUI();
}

// ═══ HOME ══════════════════════════════════════════════════
function vHome() {
  const today = new Date().getDay();
  const dateStr = new Date().toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long' });
  const doneKeys = JSON.parse(localStorage.getItem('cs3_done_' + todayKey()) || '[]');

  const chips = DAY_NAMES.map(function(d, i) {
    const sid = DB.schedule[i] || 'rest';
    const w = wo(sid);
    const label = w ? w.fields.Name.replace(' Day','').replace(' Cardio','').slice(0,6) : (sid === 'rest-walk' ? 'Rest' : 'Rest');
    const col = w ? (w.fields.Color || '#888') : '';
    const tick = (i === today && doneKeys.length) ? '✓' : '';
    return '<div class="wday' + (i===today?' is-today':'') + '" style="--wc:' + col + '" onclick="openScheduled(' + i + ')">' +
      '<div class="wday-name">' + d + '</div><div class="wday-type">' + esc(label) + '</div><div class="wday-tick">' + tick + '</div></div>';
  }).join('');

  const sid = DB.schedule[today] || 'rest';
  const w = wo(sid);
  let todayCard;
  if (w) {
    const isLift = w.fields.Type === 'lift';
    const exCount = exsFor(w.id).length;
    todayCard = '<div class="today-card" style="--wc:' + (w.fields.Color||'#888') + '" onclick="openWorkout(\'' + w.id + '\')">' +
      '<div class="tc-eyebrow">Today\'s Workout</div>' +
      '<div class="tc-row"><div class="tc-name">' + esc(w.fields.Name) + '</div><div class="tc-cta">Start →</div></div>' +
      '<div class="tc-sub">' + esc(w.fields.Subtitle||'') + ' · ' + (w.fields.Duration||30) + ' min' + (isLift ? ' · ' + exCount + ' exercises' : '') + '</div></div>';
  } else {
    todayCard = '<div class="today-card" onclick="nav(\'rest\',{walk:' + (sid==='rest-walk') + '})">' +
      '<div class="tc-eyebrow">Today</div><div class="tc-row"><div class="tc-name">Rest Day</div></div>' +
      '<div class="tc-sub">' + (sid==='rest-walk' ? 'Optional 20 min easy walk — recovery is training.' : 'Full rest. Eat protein, sleep, come back strong.') + '</div></div>';
  }

  const rows = DB.workouts.map(function(x) {
    const isLift = x.fields.Type === 'lift';
    const sub = isLift ? exsFor(x.id).length + ' exercises' : 'cardio';
    return '<div class="srow" style="--wc:' + (x.fields.Color||'#888') + '" onclick="openWorkout(\'' + x.id + '\')">' +
      '<div class="srow-l"><div class="srow-dot"></div><div><div class="srow-name">' + esc(x.fields.Name) + '</div>' +
      '<div class="srow-sub">' + sub + '</div></div></div><div class="srow-meta">' + (x.fields.Duration||30) + ' min →</div></div>';
  }).join('');

  const stats = homeStats();

  return '<div class="home-head">' +
    '<div class="home-eyebrow"><span>Clean Slate · v3</span><span class="sync-dot' + (online?'':' offline') + '"></span></div>' +
    '<div class="home-title">TRAIN<em>TODAY.</em></div>' +
    '<div class="home-date">' + dateStr + '</div></div>' +
    '<div class="pad"><div class="section-head">This week</div><div class="week-strip">' + chips + '</div>' +
    '<div class="section-head">Today</div>' + todayCard +
    '<div class="section-head">Start any workout</div>' + rows +
    '<div class="section-head" style="margin-top:22px">Progress</div>' + stats + '</div>';
}

function homeStats() {
  const st = JSON.parse(localStorage.getItem('cs3_stats') || '{"total":0,"week":0,"weekOf":""}');
  return '<div class="home-stats">' +
    '<div class="hstat"><div class="hstat-val">' + st.total + '</div><div class="hstat-label">Sessions</div></div>' +
    '<div class="hstat"><div class="hstat-val">' + st.week + '</div><div class="hstat-label">This week</div></div>' +
    '<div class="hstat"><div class="hstat-val">' + DB.workouts.length + '</div><div class="hstat-label">Workouts</div></div></div>';
}

function bumpStats() {
  const st = JSON.parse(localStorage.getItem('cs3_stats') || '{"total":0,"week":0,"weekOf":""}');
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); 
  const wk = monday.toISOString().split('T')[0];
  if (st.weekOf !== wk) { st.week = 0; st.weekOf = wk; }
  st.total++; st.week++;
  localStorage.setItem('cs3_stats', JSON.stringify(st));
  const dk = 'cs3_done_' + todayKey();
  const arr = JSON.parse(localStorage.getItem(dk) || '[]');
  arr.push(1);
  localStorage.setItem(dk, JSON.stringify(arr));
}

function openScheduled(dayIdx) {
  const sid = DB.schedule[dayIdx] || 'rest';
  const w = wo(sid);
  if (w) openWorkout(w.id);
  else nav('rest', { walk: sid === 'rest-walk' });
}

function openWorkout(id) {
  const w = wo(id);
  if (!w) return;
  if (w.fields.Type === 'cardio') { cardioSel = -1; nav('cardio', { workoutId: id }); return; }
  // start / resume live session
  if (!live || live.workoutId !== id) {
    live = { workoutId: id, sets: {}, weights: {} };
    liveWU = false;
    exsFor(id).forEach(function(ex) {
      const f = ex.fields;
      const target = f.TargetReps || f.RepMin || 8;
      live.sets[ex.id] = [];
      for (let i = 0; i < (f.Sets || 3); i++) live.sets[ex.id].push({ reps: target, done: false });
      live.weights[ex.id] = f.Weight || 0;
    });
  }
  nav('session', { workoutId: id });
}

// ═══ LIFT SESSION ══════════════════════════════════════════
function vSession() {
  const w = wo(ctx.workoutId);
  if (!w || !live) return '<div class="empty-note">Session not found.</div>';
  const f = w.fields;
  const exs = exsFor(w.id);
  let lastSS = null;
  const cards = exs.map(function(ex, i) {
    let pre = '';
    const ss = ex.fields.Superset || null;
    if (ss && ss !== lastSS) pre = '<div class="ss-tag-row">⚡ Superset ' + esc(ss) + ' — alternate, rest at the end</div>';
    lastSS = ss;
    return pre + exCard(ex, i === 0);
  }).join('');

  const totals = sessTotals();
  return '<div class="top-bar"><div class="back-btn" onclick="confirmLeave()">←</div>' +
    '<div class="top-label" style="color:' + (f.Color||'#fff') + '">' + esc(f.Name) + '</div></div>' +
    '<div class="pad" style="margin-bottom:14px"><div style="font-size:13px;color:var(--muted2)">' + esc(f.Subtitle||'') + ' · ' + (f.Duration||45) + ' min</div></div>' +
    ((f.WarmupMins) ?
      '<div class="warmup-block' + (liveWU ? ' done-wu' : '') + '" onclick="toggleWU()">' +
      '<div class="wu-l"><div style="font-size:17px">🔥</div><div><div class="wu-title">Warm-Up — ' + f.WarmupMins + ' min</div>' +
      '<div class="wu-sub">' + esc(f.WarmupDesc||'') + '</div></div></div><div class="wu-tick">' + (liveWU?'✓':'') + '</div></div>' : '') +
    '<div class="ex-wrap">' + cards + '</div>' +
    '<div style="height:130px"></div>' +
    '<div class="finish-bar"><div class="finish-prog" id="fprog">' + totals.done + ' of ' + totals.total + ' sets logged</div>' +
    '<div class="finish-prog-bar"><div class="finish-prog-fill" id="fpf" style="width:' + totals.pct + '%"></div></div>' +
    '<button class="finish-btn" id="fbtn" onclick="finishSession()"' + (totals.done===0?' disabled':'') + '>' + finishLabel(totals) + '</button></div>';
}

function finishLabel(t) {
  return t.done === 0 ? 'Log sets to finish' : (t.done === t.total ? '✓ Complete Session' : 'Finish (' + t.pct + '%)');
}

function sessTotals() {
  let done = 0, total = 0;
  Object.keys(live.sets).forEach(function(k){ live.sets[k].forEach(function(s){ total++; if (s.done) done++; }); });
  return { done: done, total: total, pct: total ? Math.round(done/total*100) : 0 };
}

function exCard(ex, open) {
  const f = ex.fields;
  const sets = live.sets[ex.id] || [];
  const wt = live.weights[ex.id];
  const target = f.TargetReps || f.RepMin;
  const allDone = sets.length > 0 && sets.every(function(s){ return s.done; });

  const rows = sets.map(function(s, i) {
    return '<div class="set-row' + (s.done?' logged':'') + '" id="sr-' + ex.id + '-' + i + '">' +
      '<div class="set-num">Set ' + (i+1) + '</div>' +
      '<div class="rep-ctrl"><button class="rbtn" onclick="repAdj(\'' + ex.id + '\',' + i + ',-1)">−</button>' +
      '<div class="rep-val" id="rv-' + ex.id + '-' + i + '">' + s.reps + ' <small>reps</small></div>' +
      '<button class="rbtn" onclick="repAdj(\'' + ex.id + '\',' + i + ',1)">+</button></div>' +
      '<button class="log-btn" onclick="logSet(\'' + ex.id + '\',' + i + ')">' + (s.done ? '✓' : 'Log') + '</button></div>';
  }).join('');

  return '<div class="ex-card' + (allDone?' ex-done':'') + (open?' ex-open':'') + '" id="ec-' + ex.id + '">' +
    '<div class="ex-head" onclick="toggleEx(\'' + ex.id + '\')"><div class="ex-head-l">' +
    '<div class="ex-exname">' + esc(f.Name) + '</div>' +
    '<div class="ex-target" id="tgt-' + ex.id + '">' + (f.Sets||3) + ' × ' + target + ' <span style="font-size:14px;color:var(--muted)">@</span> ' + wt + '<span style="font-size:12px;color:var(--muted)"> ' + esc(f.Unit||'kg') + '</span></div>' +
    '<div class="ex-tmeta">' + esc(f.Muscle||'') + ' · ' + (f.Superset ? 'Superset ' + esc(f.Superset) : restLabel(f.RestSec||60)) + '</div></div>' +
    '<div style="display:flex;align-items:center;gap:8px"><span class="ex-done-badge">✓ Done</span><span class="ex-chev">▾</span></div></div>' +
    '<div class="ex-body">' +
    (f.Note ? '<div class="ex-note">' + esc(f.Note) + '</div>' : '<div style="height:12px"></div>') +
    '<div class="weight-row"><div class="wlabel">Weight</div><div class="wctrl">' +
    '<button class="wbtn" onclick="wtAdj(\'' + ex.id + '\',-1)">−</button>' +
    '<div class="wval" id="wv-' + ex.id + '">' + wt + ' <span class="wunit">' + esc(f.Unit||'kg') + '</span></div>' +
    '<button class="wbtn" onclick="wtAdj(\'' + ex.id + '\',1)">+</button></div></div>' +
    rows +
    '<div id="nh-' + ex.id + '">' + (allDone ? hintHtml(ex) : '') + '</div>' +
    '</div></div>';
}

function hintHtml(ex) {
  const f = ex.fields;
  const sets = live.sets[ex.id];
  const minReps = Math.min.apply(null, sets.map(function(s){ return s.reps; }));
  const ns = nextStep({ TargetReps: f.TargetReps || f.RepMin, RepMin: f.RepMin, RepMax: f.RepMax, Weight: live.weights[ex.id], Increment: f.Increment }, minReps);
  if (ns.kind === 'hold') return '<div class="next-hint">Next session: <span class="nh-hold">hold at ' + (f.Sets||3) + ' × ' + ns.reps + ' @ ' + ns.wt + ' ' + esc(f.Unit||'kg') + '</span> — hit ' + (f.TargetReps||f.RepMin) + ' on every set to progress</div>';
  if (ns.kind === 'wup') return '<div class="next-hint">Next session: <span class="nh-wup">' + (f.Sets||3) + ' × ' + ns.reps + ' @ ' + ns.wt + ' ' + esc(f.Unit||'kg') + ' 🔺 weight up</span></div>';
  return '<div class="next-hint">Next session: <span class="nh-up">' + (f.Sets||3) + ' × ' + ns.reps + ' @ ' + ns.wt + ' ' + esc(f.Unit||'kg') + ' ↑ +1 rep</span></div>';
}

function toggleEx(id) { const c = document.getElementById('ec-' + id); if (c) c.classList.toggle('ex-open'); }
function toggleWU() {
  liveWU = !liveWU;
  const b = document.querySelector('.warmup-block');
  if (b) { b.classList.toggle('done-wu', liveWU); b.querySelector('.wu-tick').textContent = liveWU ? '✓' : ''; }
}

function repAdj(exId, i, d) {
  const s = live.sets[exId][i];
  s.reps = Math.max(0, s.reps + d);
  const rv = document.getElementById('rv-' + exId + '-' + i);
  if (rv) rv.innerHTML = s.reps + ' <small>reps</small>';
  if (s.done) refreshHint(exId);
}

function wtAdj(exId, dir) {
  const ex = DB.exercises.find(function(e){ return e.id === exId; });
  const inc = (ex && ex.fields.Increment) || 2.5;
  live.weights[exId] = Math.max(0, Math.round((live.weights[exId] + dir * inc) * 100) / 100);
  const wv = document.getElementById('wv-' + exId);
  if (wv) wv.innerHTML = live.weights[exId] + ' <span class="wunit">' + esc(ex.fields.Unit||'kg') + '</span>';
  const tgt = document.getElementById('tgt-' + exId);
  const f = ex.fields;
  if (tgt) tgt.innerHTML = (f.Sets||3) + ' × ' + (f.TargetReps||f.RepMin) + ' <span style="font-size:14px;color:var(--muted)">@</span> ' + live.weights[exId] + '<span style="font-size:12px;color:var(--muted)"> ' + esc(f.Unit||'kg') + '</span>';
  refreshHint(exId);
}

function logSet(exId, i) {
  const s = live.sets[exId][i];
  s.done = !s.done;
  const row = document.getElementById('sr-' + exId + '-' + i);
  if (row) {
    row.classList.toggle('logged', s.done);
    row.querySelector('.log-btn').textContent = s.done ? '✓' : 'Log';
  }
  const ex = DB.exercises.find(function(e){ return e.id === exId; });
  const allDone = live.sets[exId].every(function(x){ return x.done; });
  const card = document.getElementById('ec-' + exId);
  if (card) card.classList.toggle('ex-done', allDone);
  refreshHint(exId);
  // finish bar
  const t = sessTotals();
  const fb = document.getElementById('fbtn'), fp = document.getElementById('fprog'), ff = document.getElementById('fpf');
  if (fb) { fb.disabled = t.done === 0; fb.textContent = finishLabel(t); }
  if (fp) fp.textContent = t.done + ' of ' + t.total + ' sets logged';
  if (ff) ff.style.width = t.pct + '%';
  // rest timer
  if (s.done && ex) {
    vibrate(20);
    startTimer(ex.fields.RestSec || 60, ex.fields.Name);
  } else stopTimer();
}

function refreshHint(exId) {
  const ex = DB.exercises.find(function(e){ return e.id === exId; });
  const nh = document.getElementById('nh-' + exId);
  if (!nh || !ex) return;
  const allDone = live.sets[exId].every(function(x){ return x.done; });
  nh.innerHTML = allDone ? hintHtml(ex) : '';
}

function confirmLeave() {
  const t = sessTotals();
  if (t.done > 0 && t.done < t.total) {
    if (!confirm('Leave session? Your logged sets stay until you finish or start a different workout.')) return;
  }
  nav('home');
}

// ── rest timer ─────────────────────────────────────────────
function startTimer(sec, label) {
  stopTimer();
  timer = { remaining: sec, label: label };
  showTimerUI();
  timer.iv = setInterval(function() {
    timer.remaining--;
    const n = document.querySelector('.timer-num');
    if (n) n.textContent = fmtTimer(timer.remaining);
    if (timer.remaining <= 0) { vibrate([80,60,80]); toast('Rest over — go!'); stopTimer(); }
  }, 1000);
}
function fmtTimer(s) { const m = Math.floor(s/60); return m > 0 ? m + ':' + String(s%60).padStart(2,'0') : String(s); }
function stopTimer() { if (timer && timer.iv) clearInterval(timer.iv); timer = null; stopTimerUI(); }
function stopTimerUI() { const p = document.getElementById('timer-pill'); if (p) p.remove(); }
function showTimerUI() {
  stopTimerUI();
  if (!timer) return;
  const p = document.createElement('div');
  p.id = 'timer-pill'; p.className = 'timer-pill';
  p.innerHTML = '<div class="timer-num">' + fmtTimer(timer.remaining) + '</div>' +
    '<div class="timer-lbl">Rest · ' + esc(timer.label) + '</div>' +
    '<button class="timer-skip" onclick="stopTimer()">Skip</button>';
  document.body.appendChild(p);
}

// ── finish session ─────────────────────────────────────────
async function finishSession() {
  const w = wo(live.workoutId);
  if (!w) return;
  stopTimer();
  const progressions = [], patches = [], logOut = [];

  exsFor(w.id).forEach(function(ex) {
    const f = ex.fields;
    const sets = live.sets[ex.id] || [];
    const doneSets = sets.filter(function(s){ return s.done; });
    if (!doneSets.length) return;
    logOut.push({ name: f.Name, wt: live.weights[ex.id], unit: f.Unit || 'kg', reps: doneSets.map(function(s){ return s.reps; }) });

    if (doneSets.length === sets.length) {
      const minReps = Math.min.apply(null, sets.map(function(s){ return s.reps; }));
      const ns = nextStep({ TargetReps: f.TargetReps || f.RepMin, RepMin: f.RepMin, RepMax: f.RepMax, Weight: live.weights[ex.id], Increment: f.Increment }, minReps);
      progressions.push({ name: f.Name, unit: f.Unit || 'kg', ns: ns, from: f.TargetReps || f.RepMin });
      const fields = { Weight: ns.wt, TargetReps: ns.reps };
      if (live.weights[ex.id] !== f.Weight && ns.kind === 'hold') fields.Weight = live.weights[ex.id];
      patches.push({ id: ex.id, fields: fields });
      // local update
      ex.fields.Weight = fields.Weight; ex.fields.TargetReps = ns.reps;
    } else if (live.weights[ex.id] !== f.Weight) {
      patches.push({ id: ex.id, fields: { Weight: live.weights[ex.id] } });
      ex.fields.Weight = live.weights[ex.id];
    }
  });

  // write: batched exercise patches (max 10/req) + session record
  for (let i = 0; i < patches.length; i += 10) {
    await writeThrough('/exercises', 'PATCH', { records: patches.slice(i, i+10) }, true);
  }
  await writeThrough('/sessions', 'POST', { records: [{ fields: {
    Date: todayKey(), WorkoutId: w.id, WorkoutName: w.fields.Name, Kind: 'lift',
    Log: JSON.stringify(logOut), Progressions: JSON.stringify(progressions.map(function(p){ return { n: p.name, k: p.ns.kind, r: p.ns.reps, w: p.ns.wt }; }))
  } }] }, true);

  cacheSave();
  bumpStats();
  DB.sessions = null; // invalidate history cache
  live = null;
  showDoneModal(progressions);
}

function showDoneModal(progressions) {
  const inner = document.getElementById('modal-inner');
  let list;
  if (!progressions.length) {
    list = '<div style="font-size:13px;color:var(--muted2);text-align:center;padding:14px 0">No exercises fully completed.<br>Log every set next time to trigger progression.</div>';
  } else {
    list = progressions.map(function(p) {
      let chg;
      if (p.ns.kind === 'wup') chg = '<span class="prog-chg pc-wt">' + p.ns.wt + ' ' + esc(p.unit) + ' 🔺</span>';
      else if (p.ns.kind === 'up') chg = '<span class="prog-chg pc-rep">' + p.from + '→' + p.ns.reps + ' reps</span>';
      else chg = '<span class="prog-chg pc-hold">hold</span>';
      return '<div class="prog-item"><div class="prog-name">' + esc(p.name) + '</div>' + chg + '</div>';
    }).join('');
  }
  inner.innerHTML = '<div class="modal-title">Session Done 💪</div>' +
    '<div class="modal-sub">Progression locked in for next time.</div>' + list +
    '<button class="modal-btn" onclick="closeModal()">Back to Home</button>';
  document.getElementById('modal').classList.add('open');
}

async function loadHistory() {

  }
  if (view !== 'history') return;

function vHistory() {
  const sess = (DB.sessions || []).slice().sort(function(a,b){ return (b.fields.Date||'').localeCompare(a.fields.Date||''); });
  if (!sess.length) return '<div class="top-bar"><div class="top-label">History</div></div>' +
    '<div class="empty-note">No sessions yet.<br>Your first completed workout will land here.</div>';

  const groups = {};
  sess.forEach(function(s) {
    const key = (s.fields.Date || '').slice(0, 7);
    (groups[key] = groups[key] || []).push(s);
  });

  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const html = Object.keys(groups).sort().reverse().map(function(mk) {
    const parts = mk.split('-');
    const label = monthNames[parseInt(parts[1],10)-1] + ' ' + parts[0];
    const rows = groups[mk].map(function(s) {
      const f = s.fields;
      const w = wo(f.WorkoutId);
      const col = w ? (w.fields.Color || '#888') : '#888';
      let body = '';
      try {
        const log = JSON.parse(f.Log || 'null');
        if (Array.isArray(log)) {
          body = log.map(function(e) {
            return '<div class="hlog-row"><div class="hlog-name">' + esc(e.name) + '</div>' +
              '<div class="hlog-sets">' + e.reps.join('·') + ' @ ' + e.wt + esc(e.unit||'kg') + '</div></div>';
          }).join('');
        } else if (log && log.mins) {
          body = '<div class="hlog-row"><div class="hlog-name">' + (log.method ? esc(log.method) : 'Cardio') + '</div><div class="hlog-sets">' + log.mins + ' min</div></div>';
        }
      } catch(e) {}
      return '<div class="hist-row"><div class="hist-head" onclick="this.parentElement.classList.toggle(\'open\')">' +
        '<div class="hist-l"><div class="srow-dot" style="--wc:' + col + ';background:' + col + '"></div>' +
        '<div class="hist-date">' + fmtDate(f.Date || '') + '</div>' +
        '<div class="hist-name">' + esc(f.WorkoutName || '') + '</div></div>' +
        '<span class="ex-chev">▾</span></div>' +
        (body ? '<div class="hist-body">' + body + '</div>' : '') + '</div>';
    }).join('');
    return '<div class="month-head">' + label + ' <span class="month-count">' + groups[mk].length + ' sessions</span></div>' + rows;
  }).join('');

  return '<div class="top-bar"><div class="top-label">History</div></div><div class="pad">' + html + '</div>';
}

async function saveWorkout() {
  const w = ctx.id ? wo(ctx.id) : null;
  const name = document.getElementById('wf-name').value.trim();
  if (!name) { toast('Name required'); return; }
  const type = document.getElementById('wf-type').value;
  const fields = {
    Name: name, Type: type,
    Color: pickedColor || (w ? w.fields.Color : SWATCHES[0]) || SWATCHES[0],
    Subtitle: document.getElementById('wf-sub').value,
    Duration: parseInt(document.getElementById('wf-dur').value, 10) || 30
  };
  if (type === 'lift') {
    fields.WarmupMins = parseInt(document.getElementById('wf-wumins').value, 10) || 0;
    fields.WarmupDesc = document.getElementById('wf-wudesc').value;
  } else {
    fields.CardioDesc = document.getElementById('wf-cdesc').value;
    fields.CardioOptions = JSON.stringify(document.getElementById('wf-copts').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean));
    fields.CardioNote = document.getElementById('wf-cnote').value;
  }

  if (w) {
    const r = await writeThrough('/workouts', 'PATCH', { records: [{ id: w.id, fields: fields }] });
    if (r) { Object.assign(w.fields, fields); cacheSave(); toast('Saved ✓'); nav('manage'); }
  } else {
    fields.Order = DB.workouts.length + 1;
    const r = await writeThrough('/workouts', 'POST', { records: [{ fields: fields }], typecast: true });
    if (r && r.records) {
      DB.workouts.push(r.records[0]);
      cacheSave(); toast('Workout added ✓');
      nav('editWorkout', { id: r.records[0].id });
    }
  }
}

async function deleteWorkout(id) {
  const exs = exsFor(id);
  if (!confirm('Delete this workout' + (exs.length ? ' and its ' + exs.length + ' exercises' : '') + '? History is kept.')) return;
  if (exs.length) {
    for (let i = 0; i < exs.length; i += 10) {
      const chunk = exs.slice(i, i+10).map(function(e){ return 'records[]=' + e.id; }).join('&');
      await writeThrough('/exercises?' + chunk, 'DELETE');
    }
  }
  const r = await writeThrough('/workouts?records[]=' + id, 'DELETE');
  if (r) {
    DB.workouts = DB.workouts.filter(function(x){ return x.id !== id; });
    DB.exercises = DB.exercises.filter(function(x){ return x.fields.WorkoutId !== id; });
    Object.keys(DB.schedule).forEach(function(k){ if (DB.schedule[k] === id) DB.schedule[k] = 'rest'; });
    cacheSave();
    writeThrough('/settings/' + DB.scheduleRecId, 'PATCH', { fields: { Value: JSON.stringify(DB.schedule) } }, true);
    toast('Deleted');
    nav('manage');
  }
}

  const fields = {
    Name: name,
    WorkoutId: ctx.workoutId,
    Muscle: document.getElementById('ef-muscle').value,
    Superset: document.getElementById('ef-ss').value.trim().toUpperCase(),
    Sets: parseInt(document.getElementById('ef-sets').value, 10) || 3,
    RepMin: rmin, RepMax: rmax,
    Weight: parseFloat(document.getElementById('ef-wt').value) || 0,
    Increment: parseFloat(document.getElementById('ef-inc').value) || 2.5,
    Unit: document.getElementById('ef-unit').value,
    RestSec: parseInt(document.getElementById('ef-rest').value, 10) || 60,
    Note: document.getElementById('ef-note').value
  };
  if (ex) {
    // clamp target into new range
    const t = ex.fields.TargetReps || rmin;
    fields.TargetReps = Math.min(Math.max(t, rmin), rmax);
    const r = await writeThrough('/exercises', 'PATCH', { records: [{ id: ex.id, fields: fields }] });
    if (r) { Object.assign(ex.fields, fields); cacheSave(); toast('Saved ✓'); nav('editWorkout', { id: ctx.workoutId }); }
  } else {
    fields.TargetReps = rmin;
    fields.Order = exsFor(ctx.workoutId).length + 1;
    const r = await writeThrough('/exercises', 'POST', { records: [{ fields: fields }], typecast: true });
    if (r && r.records) {
      DB.exercises.push(r.records[0]);
      cacheSave(); toast('Exercise added ✓');
      nav('editWorkout', { id: ctx.workoutId });
    }
  }
}

async function deleteExercise(id) {
  if (!confirm('Delete this exercise? History is kept.')) return;
  const r = await writeThrough('/exercises?records[]=' + id, 'DELETE');
  if (r) {
    DB.exercises = DB.exercises.filter(function(x){ return x.id !== id; });
    cacheSave(); toast('Deleted');
    nav('editWorkout', { id: ctx.workoutId });
  }
}

// ═══ INIT ══════════════════════════════════════════════════
window.addEventListener('online', function(){ online = true; updateSyncDot(); flushQueue(); });
window.addEventListener('offline', function(){ online = false; updateSyncDot(); });

(async function init() {
  const hadCache = cacheLoad();
  if (hadCache) { nav('home'); loadAll(true).then(function(){ if (view === 'home') render(); }); }
  else { await loadAll(); nav('home'); }
})();
</script>
